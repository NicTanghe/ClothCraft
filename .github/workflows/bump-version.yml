name: PR package version

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  version:
    name: Check merge version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check the version in the proposed merge
        run: python3 scripts/bump-version.py --check HEAD^1
