name: Bump patch version

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump the Cargo version on main
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/bump-version.py "$RUNNER_TEMP/bump-version.py"
          for attempt in 1 2 3 4 5; do
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            base=$(git rev-parse origin/main)
            git switch --detach "$base"
            version=$(python3 "$RUNNER_TEMP/bump-version.py")
            if [[ -z "$version" ]]; then
              exit 0
            fi
            git add Cargo.toml Cargo.lock
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m "Bump ClothCraft to $version"
            if git push origin HEAD:refs/heads/main; then
              exit 0
            fi
            # A competing push may have advanced main. Recompute from its tip.
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            if [[ "$(git rev-parse origin/main)" == "$base" ]]; then
              exit 1
            fi
          done
          echo "main kept advancing while the version bump was being pushed" >&2
          exit 1
